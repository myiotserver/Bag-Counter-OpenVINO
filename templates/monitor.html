<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Monitor - Bag Counter</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/webp" sizes="32x32" href="/static/sriboga-logo.webp">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b12;
      --panel: #111827;
      --panel-2: #172033;
      --line: #273248;
      --text: #eef4ff;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --blue: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --amber: #f59e0b;
      --shadow: 0 18px 46px rgba(0, 0, 0, .28);
      --radius: 8px;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 78px 1fr;
      letter-spacing: 0;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 20px;
      padding: 14px 26px;
      background: linear-gradient(180deg, #111827 0%, #0d1422 100%);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 4px;
      background: #fff;
      padding: 3px;
    }

    .brand h1 {
      font-size: 27px;
      line-height: 1;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .top-summary {
      display: flex;
      justify-content: center;
      gap: 12px;
      min-width: 0;
    }

    .summary-chip {
      min-width: 148px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(23, 32, 51, .76);
    }

    .summary-chip .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .summary-chip .value {
      margin-top: 2px;
      color: var(--soft);
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 230px;
    }

    .clock {
      min-width: 122px;
      text-align: right;
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .status-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 150px;
      height: 48px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #1f2937;
      color: var(--soft);
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .status-pill .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-pill.running {
      border-color: rgba(34, 197, 94, .55);
      background: rgba(34, 197, 94, .12);
      color: #bbf7d0;
    }

    .status-pill.running .dot {
      background: var(--green);
      box-shadow: 0 0 18px rgba(34, 197, 94, .9);
    }

    .status-pill.error {
      border-color: rgba(239, 68, 68, .6);
      background: rgba(239, 68, 68, .13);
      color: #fecaca;
    }

    .status-pill.error .dot {
      background: var(--red);
      box-shadow: 0 0 18px rgba(239, 68, 68, .9);
    }

    .dashboard {
      height: calc(100vh - 78px);
      display: grid;
      grid-template-columns: minmax(560px, 36vw) 1fr;
      gap: 18px;
      padding: 18px;
      background:
        radial-gradient(circle at 25% 0%, rgba(56, 189, 248, .08), transparent 30%),
        linear-gradient(135deg, #080b12 0%, #0b1220 56%, #0a0f19 100%);
    }

    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(17, 24, 39, .93);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .production-panel {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
      padding: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #f8fafc;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .35);
    }

    .section-title span {
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-transform: none;
      opacity: .96;
    }

    .count-grid {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      min-height: 0;
    }

    .count-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .015) 0%, rgba(255, 255, 255, 0) 100%),
        var(--panel-2);
      overflow: hidden;
    }

    .count-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 8px;
      background: var(--blue);
    }

    .count-card.in::before {
      background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%);
      box-shadow: 0 0 22px rgba(239, 68, 68, .5);
    }
    .count-card.out::before {
      background: linear-gradient(180deg, #4ade80 0%, #15803d 100%);
      box-shadow: 0 0 22px rgba(74, 222, 128, .45);
    }

    .count-card .label {
      color: #f8fafc;
      font-size: 23px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .35);
    }

    .count-card .number {
      margin-top: 8px;
      font-size: clamp(86px, 7.2vw, 142px);
      line-height: .9;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      text-shadow: 0 6px 24px rgba(0, 0, 0, .35);
      transition: color .2s ease, transform .2s ease;
    }

    .count-card.in .number {
      color: #ffe4e6;
      text-shadow:
        0 0 18px rgba(251, 113, 133, .24),
        0 8px 26px rgba(0, 0, 0, .38);
    }
    .count-card.out .number {
      color: #dcfce7;
      text-shadow:
        0 0 18px rgba(74, 222, 128, .22),
        0 8px 26px rgba(0, 0, 0, .38);
    }
    .count-card.changed .number {
      transform: scale(1.035);
      color: #fff;
    }

    .net-card {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      border: 1px solid rgba(56, 189, 248, .42);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(125, 211, 252, .08) 0%, rgba(56, 189, 248, .03) 100%),
        rgba(56, 189, 248, .11);
    }

    .net-card .label {
      color: #e0f2fe;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .32);
    }

    .net-card .sub {
      margin-top: 4px;
      color: #dbeafe;
      font-size: 13px;
      font-weight: 700;
      opacity: .92;
    }

    .net-card .number {
      color: #bae6fd;
      font-size: clamp(70px, 5.3vw, 104px);
      line-height: .9;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 0 18px rgba(56, 189, 248, .24),
        0 8px 26px rgba(0, 0, 0, .38);
      transition: transform .2s ease, color .2s ease;
    }

    .net-card.changed .number {
      transform: scale(1.04);
      color: #fff;
    }

    .video-panel {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
    }

    .video-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }

    .video-head h2 {
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .video-head .meta {
      display: flex;
      gap: 12px;
      min-width: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .video-wrap {
      position: relative;
      min-height: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .video-overlay {
      position: absolute;
      top: 16px;
      right: 16px;
      max-width: calc(100% - 32px);
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: var(--radius);
      background: rgba(0, 0, 0, .64);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      backdrop-filter: blur(6px);
      font-variant-numeric: tabular-nums;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      border-top: 1px solid var(--line);
      background: var(--line);
    }

    .metric {
      min-width: 0;
      padding: 15px 16px;
      background: var(--panel);
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .metric .value {
      margin-top: 5px;
      color: var(--text);
      font-size: 25px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric.warning .value { color: #fcd34d; }
    .metric.info .value { color: #7dd3fc; }

    .error-banner {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: none;
      padding: 12px 14px;
      border: 1px solid rgba(239, 68, 68, .58);
      border-radius: var(--radius);
      background: rgba(127, 29, 29, .88);
      color: #fee2e2;
      font-size: 16px;
      font-weight: 800;
    }

    .error-banner.visible { display: block; }

    @media (max-width: 1366px) {
      body { grid-template-rows: 68px 1fr; }
      .topbar { padding: 10px 16px; gap: 12px; }
      .brand img { width: 40px; height: 40px; }
      .brand h1 { font-size: 22px; }
      .brand p { font-size: 12px; }
      .summary-chip { min-width: 118px; padding: 7px 10px; }
      .summary-chip .value { font-size: 15px; }
      .clock { font-size: 20px; min-width: 102px; }
      .status-pill { min-width: 128px; height: 42px; font-size: 15px; }
      .dashboard {
        height: calc(100vh - 68px);
        grid-template-columns: minmax(430px, 35vw) 1fr;
        gap: 12px;
        padding: 12px;
      }
      .production-panel { padding: 14px; gap: 10px; }
      .count-card { padding: 16px 18px; }
      .count-card .label { font-size: 18px; }
      .metric { padding: 11px 12px; }
      .metric .value { font-size: 20px; }
    }

    @media (max-width: 960px), (orientation: portrait) {
      html, body { overflow: auto; }
      body { display: block; min-height: 100vh; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "brand status"
          "summary summary";
      }
      .brand { grid-area: brand; }
      .status-pill { grid-area: status; min-width: 112px; }
      .top-summary {
        grid-area: summary;
        justify-content: stretch;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .clock { display: none; }
      .dashboard {
        height: auto;
        min-height: calc(100vh - 122px);
        grid-template-columns: 1fr;
      }
      .production-panel { min-height: 540px; }
      .video-panel { min-height: 520px; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric-grid .metric:last-child { grid-column: span 2; }
      .video-head { align-items: flex-start; flex-direction: column; }
      .video-head .meta { flex-wrap: wrap; }
    }

    @media (max-width: 620px) {
      .brand h1 { font-size: 19px; }
      .brand p { display: none; }
      .topbar { padding: 10px; }
      .dashboard { padding: 10px; }
      .count-grid { grid-template-rows: auto auto; }
      .count-card .number { font-size: 70px; }
      .net-card {
        grid-template-columns: 1fr;
        text-align: left;
      }
      .net-card .number { font-size: 72px; }
      .metric-grid { grid-template-columns: 1fr; }
      .metric-grid .metric:last-child { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/sriboga-logo.webp" alt="Bag Counter">
      <div>
        <h1>Production Monitor</h1>
        <p>Real-time Bag Counter Dashboard</p>
      </div>
    </div>

    <div class="top-summary" aria-label="Ringkasan sistem">
      <div class="summary-chip">
        <div class="label">Updated</div>
        <div class="value" id="last-ts">Menunggu data</div>
      </div>
      <div class="summary-chip">
        <div class="label">Source</div>
        <div class="value" id="source-label">-</div>
      </div>
      <div class="summary-chip">
        <div class="label">Model</div>
        <div class="value" id="model-label">-</div>
      </div>
    </div>

    <div class="clock" id="clock">--:--:--</div>

    <div class="status-pill" id="status-pill">
      <div class="dot"></div>
      <span id="status-text">IDLE</span>
    </div>
  </header>

  <main class="dashboard">
    <section class="panel production-panel" aria-label="Data produksi">
      <div class="section-title">
        <div>Data Produksi</div>
        <span id="production-date">-</span>
      </div>

      <div class="count-grid">
        <article class="count-card in" id="card-count-in">
          <div class="label">Count IN</div>
          <div class="number" id="stat-count-in">0</div>
        </article>

        <article class="count-card out" id="card-count-out">
          <div class="label">Count OUT</div>
          <div class="number" id="stat-count-out">0</div>
        </article>
      </div>

      <article class="net-card" id="card-net">
        <div>
          <div class="label">Net</div>
          <div class="sub">OUT - IN</div>
        </div>
        <div class="number" id="stat-net">0</div>
      </article>
    </section>

    <section class="panel video-panel" aria-label="Live feed dan metrik">
      <div class="video-head">
        <h2>Live Camera Feed</h2>
        <div class="meta">
          <span id="frame-label">Frame #0</span>
          <span id="device-label">Device: -</span>
        </div>
      </div>

      <div class="video-wrap">
        <img id="mjpeg" src="/video_feed" alt="Live stream">
        <div class="video-overlay">
          <span id="overlay-status">IDLE</span>
          <span id="overlay-detections">0 objek</span>
        </div>
        <div class="error-banner" id="error-banner"></div>
      </div>

      <div class="metric-grid" aria-label="Metrik sistem">
        <div class="metric info">
          <div class="label">Deteksi Frame</div>
          <div class="value" id="count-num">0</div>
        </div>
        <div class="metric">
          <div class="label">Frame ID</div>
          <div class="value" id="stat-frames">0</div>
        </div>
        <div class="metric warning">
          <div class="label">Latency</div>
          <div class="value" id="stat-latency">-</div>
        </div>
        <div class="metric">
          <div class="label">Infer/min</div>
          <div class="value" id="stat-fps">0</div>
        </div>
        <div class="metric">
          <div class="label">Avg Confidence</div>
          <div class="value" id="stat-avg">-</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const PORT = {{ bridge_port }};
    const BASE = `http://${location.hostname}:${PORT}`;
    const numberFmt = new Intl.NumberFormat("id-ID");
    const timeFmt = new Intl.DateTimeFormat("id-ID", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
    const dateFmt = new Intl.DateTimeFormat("id-ID", {
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    });

    const els = {
      clock: document.getElementById("clock"),
      productionDate: document.getElementById("production-date"),
      statusPill: document.getElementById("status-pill"),
      statusText: document.getElementById("status-text"),
      overlayStatus: document.getElementById("overlay-status"),
      overlayDetections: document.getElementById("overlay-detections"),
      lastTs: document.getElementById("last-ts"),
      sourceLabel: document.getElementById("source-label"),
      modelLabel: document.getElementById("model-label"),
      deviceLabel: document.getElementById("device-label"),
      frameLabel: document.getElementById("frame-label"),
      countNum: document.getElementById("count-num"),
      frames: document.getElementById("stat-frames"),
      avg: document.getElementById("stat-avg"),
      fps: document.getElementById("stat-fps"),
      latency: document.getElementById("stat-latency"),
      countIn: document.getElementById("stat-count-in"),
      countOut: document.getElementById("stat-count-out"),
      net: document.getElementById("stat-net"),
      cardIn: document.getElementById("card-count-in"),
      cardOut: document.getElementById("card-count-out"),
      cardNet: document.getElementById("card-net"),
      errorBanner: document.getElementById("error-banner")
    };

    const previousValues = {
      countIn: 0,
      countOut: 0,
      net: 0
    };
    let frameHistory = [];
    let reconnectTimer = null;

    function updateClock() {
      const now = new Date();
      els.clock.textContent = timeFmt.format(now);
      els.productionDate.textContent = dateFmt.format(now);
    }

    function formatNumber(value) {
      return numberFmt.format(Number.isFinite(value) ? value : 0);
    }

    function setChanged(card) {
      card.classList.add("changed");
      window.setTimeout(() => card.classList.remove("changed"), 260);
    }

    function setNumber(el, card, key, value) {
      const safeValue = Number.isFinite(value) ? value : 0;
      el.textContent = formatNumber(safeValue);
      if (previousValues[key] !== safeValue) {
        previousValues[key] = safeValue;
        setChanged(card);
      }
    }

    function setStatus(running, error) {
      els.statusPill.className = "status-pill";

      if (error) {
        els.statusPill.classList.add("error");
        els.statusText.textContent = "ERROR";
        els.overlayStatus.textContent = "ERROR";
        return;
      }

      if (running) {
        els.statusPill.classList.add("running");
        els.statusText.textContent = "RUNNING";
        els.overlayStatus.textContent = "RUNNING";
        return;
      }

      els.statusText.textContent = "IDLE";
      els.overlayStatus.textContent = "IDLE";
    }

    function updateMetricData(d) {
      const detections = Array.isArray(d.detections) ? d.detections : [];
      const totalDetections = Number(d.total_detections ?? detections.length ?? 0);
      const frameId = Number(d.frame_id ?? 0);
      const latency = Number(d.inference_latency_ms ?? 0);

      els.countNum.textContent = formatNumber(totalDetections);
      els.overlayDetections.textContent = `${formatNumber(totalDetections)} objek`;
      els.frames.textContent = formatNumber(frameId);
      els.frameLabel.textContent = `Frame #${formatNumber(frameId)}`;
      els.latency.textContent = latency > 0 ? `${formatNumber(Math.round(latency))} ms` : "-";

      if (detections.length > 0) {
        const avg = detections.reduce((sum, item) => sum + Number(item.confidence ?? 0), 0) / detections.length;
        els.avg.textContent = `${Math.round(avg * 100)}%`;
      } else {
        els.avg.textContent = "-";
      }

      const now = Date.now();
      frameHistory.push(now);
      frameHistory = frameHistory.filter((time) => now - time < 60000);
      els.fps.textContent = formatNumber(frameHistory.length);
    }

    function updateProductionData(d) {
      const countIn = Number(d.count_in ?? 0);
      const countOut = Number(d.count_out ?? 0);
      const net = countOut - countIn;

      setNumber(els.countIn, els.cardIn, "countIn", countIn);
      setNumber(els.countOut, els.cardOut, "countOut", countOut);
      setNumber(els.net, els.cardNet, "net", net);
    }

    function updateInfoData(d) {
      if (d.timestamp) {
        const ts = new Date(d.timestamp);
        els.lastTs.textContent = Number.isNaN(ts.getTime()) ? "Menunggu data" : timeFmt.format(ts);
      } else {
        els.lastTs.textContent = "Menunggu data";
      }

      els.sourceLabel.textContent = d.source ? String(d.source) : "-";

      // v1.0.1 uses "model_path" and "infer_device" keys
      if (d.model_path) {
        const parts = d.model_path.replace(/\\/g, "/").split("/");
        els.modelLabel.textContent = parts[parts.length - 1] || d.model_path;
      } else {
        els.modelLabel.textContent = "-";
      }

      els.deviceLabel.textContent = `Device: ${d.infer_device ? String(d.infer_device) : "-"}`;

      if (d.error) {
        els.errorBanner.textContent = String(d.error);
        els.errorBanner.classList.add("visible");
      } else {
        els.errorBanner.textContent = "";
        els.errorBanner.classList.remove("visible");
      }
    }

    function applyState(d) {
      setStatus(Boolean(d.running), d.error);
      updateProductionData(d);
      updateMetricData(d);
      updateInfoData(d);
    }

    function connectSSE() {
      if (reconnectTimer) {
        window.clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }

      const es = new EventSource(`${BASE}/results/stream`);

      es.onmessage = (ev) => {
        let data;
        try {
          data = JSON.parse(ev.data);
        } catch {
          return;
        }
        applyState(data);
      };

      es.onerror = () => {
        es.close();
        setStatus(false, "Koneksi SSE terputus");
        els.errorBanner.textContent = "Koneksi data terputus. Mencoba menyambung ulang...";
        els.errorBanner.classList.add("visible");
        reconnectTimer = window.setTimeout(connectSSE, 3000);
      };
    }

    updateClock();
    window.setInterval(updateClock, 1000);
    connectSSE();
  </script>
</body>
</html>
